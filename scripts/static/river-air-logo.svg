    <path d="M9 26.6C20 26.2 30 20.8 39 9.6C31.6 23.4 21.6 32.4 9 33.2A3.3 3.3 0 0 1 9 26.6Z"/>
    <path d="M9 18.4C15 18.3 21 16.4 27 11.8C22.4 18.6 16.6 22.3 9 22.6A2.1 2.1 0 0 1 9 18.4Z" fill-opacity=".72"/>
    <path d="M13.6 35.6C24.4 35.3 32.2 31 39.4 21.6C33.6 33.6 25.6 39.8 13.6 40.2A2.3 2.3 0 0 1 13.6 35.6Z" fill-opacity=".5"/>
  </g>
</svg>
