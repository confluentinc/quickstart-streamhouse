<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <title>River Air</title>
  <defs>
    <linearGradient id="ra-tile" x1="4" y1="46" x2="44" y2="2" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06B6D4"/>
      <stop offset=".52" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="ra-sheen" x1="24" y1="0" x2="24" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".30"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="13" fill="url(#ra-tile)"/>
  <rect x=".5" y=".5" width="47" height="47" rx="12.5" fill="url(#ra-sheen)" stroke="#FFFFFF" stroke-opacity=".2"/>
  <!-- Three currents of a river, tapering into wingtips as they sweep up and
       to the right: a wing at takeoff. -->
